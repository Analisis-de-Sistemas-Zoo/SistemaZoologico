<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vender entradas | Mirada Salvaje</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/zoo.css">
</head>
<body class="cargando">

  <main class="app-main" data-titulo="Vender entradas">
    <div class="pagina-encabezado">
      <div>
        <h2>Vender entradas</h2>
        <p>Venta en taquilla. Elige las entradas, cobra y entrega los boletos con su código QR.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <section class="panel panel-cuerpo">
          <div class="row g-3 mb-2">
            <div class="col-sm-6">
              <label class="form-label" for="fechaVisita">Fecha de visita</label>
              <input class="form-control" type="date" id="fechaVisita" required>
              <div class="invalid-feedback" id="errorFecha"></div>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="cupon">Cupón <span class="text-secondary fw-normal">(opcional)</span></label>
              <div class="input-group">
                <input class="form-control text-uppercase" id="cupon" maxlength="20" autocomplete="off">
                <button class="btn btn-outline-primary" type="button" id="btnCupon">Aplicar</button>
              </div>
              <div class="form-text" id="mensajeCupon"></div>
            </div>
          </div>
          <h3 class="h6 mt-3 mb-1">Entradas</h3>
          <div id="listaTipos" aria-live="polite"></div>
        </section>
      </div>

      <div class="col-lg-5">
        <form class="panel panel-cuerpo position-sticky" style="top: 5.5rem" id="formCobro" novalidate>
          <h3 class="h5 mb-3">Cobro</h3>
          <div class="alert alert-danger d-none" data-error-general role="alert"></div>
          <div id="resumen" aria-live="polite"><p class="text-secondary mb-0">Agrega entradas para ver el total.</p></div>

          <fieldset class="mt-3">
            <legend class="form-label">Forma de pago</legend>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="metodo_pago" id="pEfectivo" value="efectivo" checked>
                <label class="form-check-label" for="pEfectivo">Efectivo</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="metodo_pago" id="pTarjeta" value="tarjeta">
                <label class="form-check-label" for="pTarjeta">Tarjeta (POS)</label>
              </div>
            </div>
          </fieldset>

          <div class="row g-2 mt-1" id="grupoEfectivo">
            <div class="col-6">
              <label class="form-label" for="recibido">Recibido</label>
              <div class="input-group">
                <span class="input-group-text">Q</span>
                <input class="form-control" type="number" id="recibido" min="0" step="0.01" inputmode="decimal">
              </div>
            </div>
            <div class="col-6">
              <span class="form-label d-block">Cambio</span>
              <div class="fs-4 fw-semibold" id="cambio">Q0.00</div>
            </div>
          </div>

          <details class="mt-3">
            <summary class="small">Datos para la factura (opcional)</summary>
            <div class="row g-2 mt-1">
              <div class="col-7">
                <label class="form-label" for="cNombre">Nombre</label>
                <input class="form-control" id="cNombre" name="nombre" maxlength="120">
              </div>
              <div class="col-5">
                <label class="form-label" for="cNit">NIT</label>
                <input class="form-control text-uppercase" id="cNit" name="nit" maxlength="20" placeholder="CF">
              </div>
            </div>
          </details>

          <div class="d-grid gap-2 mt-3">
            <button class="btn btn-acento btn-lg" type="submit" id="btnCobrar" disabled>Cobrar</button>
            <button class="btn btn-light" type="button" id="btnLimpiar">Nueva venta</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Entradas emitidas -->
  <div class="modal fade" id="modalBoletos" tabindex="-1" aria-labelledby="tituloBoletos" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloBoletos">Entradas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="infoBoletos"></div>
          <div id="boletos"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-primary" id="btnImprimir"><i class="bi bi-printer me-2"></i>Imprimir entradas</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="/vendor/qrcode/qrcode.js" defer></script>
  <script src="/assets/js/core/api.js" defer></script>
  <script src="/assets/js/core/ui.js" defer></script>
  <script src="/assets/js/core/etiquetas.js" defer></script>
  <script src="/assets/js/core/layout.js" defer></script>
  <script src="/assets/js/modulos/entradas/etiquetas.js" defer></script>
  <script src="/assets/js/modulos/entradas/boletos.js" defer></script>
  <script src="/assets/js/modulos/entradas/venta.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validar ingreso | Mirada Salvaje</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/zoo.css">
</head>
<body class="cargando">

  <main class="app-main" data-titulo="Validar ingreso">
    <div class="pagina-encabezado">
      <div>
        <h2>Validar ingreso</h2>
        <p>Escanea el código QR de la entrada con el lector o escribe el código. Cada entrada solo se puede usar una vez, el día de su visita.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <form class="panel panel-cuerpo" id="formValidar" novalidate>
          <label class="form-label" for="codigoQr">Código de la entrada</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text"><i class="bi bi-qr-code-scan"></i></span>
            <input class="form-control font-monospace" id="codigoQr" name="codigo_qr" maxlength="32" autocomplete="off" spellcheck="false" placeholder="Escanea o escribe el código" required>
            <button class="btn btn-primary" type="submit">Validar</button>
          </div>
          <div class="form-text">El lector escribe el código y presiona Enter solo. El cursor vuelve aquí después de cada validación.</div>
        </form>
        <div class="mt-3" id="resultado" aria-live="assertive"></div>
      </div>

      <div class="col-lg-5">
        <section class="panel panel-cuerpo">
          <h3 class="h5 mb-3">Hoy</h3>
          <div class="resumen resumen-compacta mb-3" id="resumenHoy"></div>
          <h4 class="h6">Últimos ingresos</h4>
          <ul class="list-unstyled mb-0 lista-ingresos" id="ultimos"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="/assets/js/core/api.js" defer></script>
  <script src="/assets/js/core/ui.js" defer></script>
  <script src="/assets/js/core/etiquetas.js" defer></script>
  <script src="/assets/js/core/layout.js" defer></script>
  <script src="/assets/js/modulos/entradas/etiquetas.js" defer></script>
  <script src="/assets/js/modulos/entradas/validar.js" defer></script>
</body>
</html>

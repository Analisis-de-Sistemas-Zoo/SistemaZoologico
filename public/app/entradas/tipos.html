<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipos de entrada | Mirada Salvaje</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/zoo.css">
</head>
<body class="cargando">

  <main class="app-main" data-titulo="Tipos de entrada">
    <div class="pagina-encabezado">
      <div>
        <h2>Tipos de entrada</h2>
        <p>Entradas que se venden en taquilla y en línea, con su precio. Cambiar el precio no afecta las ventas ya hechas.</p>
      </div>
      <button class="btn btn-primary" type="button" id="btnNuevo"><i class="bi bi-plus-lg me-2"></i>Nuevo tipo</button>
    </div>

    <section class="panel">
      <form class="filtros" id="formFiltros">
        <div>
          <label class="form-label" for="fActivo">Estado</label>
          <select class="form-select" id="fActivo" name="activo">
            <option value="">Todos</option>
            <option value="1">Activos</option>
            <option value="0">Inactivos</option>
          </select>
        </div>
      </form>
      <div class="table-responsive">
        <table class="table table-hover tabla-zoo">
          <thead>
            <tr>
              <th>Entrada</th>
              <th>Descripción</th>
              <th class="text-end">Precio</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formEditar" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModal">Nuevo tipo de entrada</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none" data-error-general role="alert"></div>
          <div class="row g-3">
            <div class="col-sm-8">
              <label class="form-label" for="tNombre">Nombre</label>
              <input class="form-control" id="tNombre" name="nombre" maxlength="60" placeholder="Ej. Adulto" required>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="tPrecio">Precio</label>
              <div class="input-group">
                <span class="input-group-text">Q</span>
                <input class="form-control" id="tPrecio" name="precio" type="number" min="0" step="0.01" required>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="tDescripcion">Descripción</label>
              <input class="form-control" id="tDescripcion" name="descripcion" maxlength="200" placeholder="Ej. De 13 a 59 años">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="/assets/js/core/api.js" defer></script>
  <script src="/assets/js/core/ui.js" defer></script>
  <script src="/assets/js/core/etiquetas.js" defer></script>
  <script src="/assets/js/core/crud.js" defer></script>
  <script src="/assets/js/core/layout.js" defer></script>
  <script src="/assets/js/modulos/entradas/etiquetas.js" defer></script>
  <script src="/assets/js/modulos/entradas/tipos.js" defer></script>
</body>
</html>
